<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CET4 学习工作台</title>
<meta name="theme-color" content="#141c22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="四级单词、听力、阅读、翻译、写作，断网也能用">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="app-v2.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C4</div>
      <div class="brand-text"><b>学习工作台</b><span id="brand-mode">LOADING</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>连续学习 <b id="sf-streak">0</b> 天</div>
      <div>待复习 <b id="sf-due">0</b> 词</div>
      <div>今日 <b id="sf-today">0</b> 次</div>
      <div style="margin-top:6px;opacity:.65" id="sf-mode">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">总览</h1>
        <div class="sub" id="page-sub">加载中…</div>
      </div>
      <div class="top-right">
        <span class="pill" id="pill-date">--</span>
        <span class="pill accent" id="pill-due">待复习 0</span>
        <span class="pill warm" id="pill-streak">连续 0 天</span>
      </div>
    </div>
    <div id="app"><div class="empty">正在加载…</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
